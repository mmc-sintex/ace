<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Shadow Clash</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <div id="topUI">
        <div class="fighterInfo">
            <div class="name" id="playerName">ARKEN</div>
            <div class="healthBar">
                <div id="playerHealth"></div>
            </div>
        </div>

        <div id="roundText">ROUND 1</div>

        <div class="fighterInfo enemyInfo">
            <div class="name" id="enemyName">VORK</div>
            <div class="healthBar">
                <div id="enemyHealth"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobileControls">

        <div id="movementButtons">
            <button data-action="left">◀</button>
            <button data-action="right">▶</button>
        </div>

        <div id="actionButtons">
            <button data-action="jump">▲</button>
            <button data-action="crouch">▼</button>
            <button data-action="punch">👊</button>
            <button data-action="kick">🦵</button>
            <button data-action="block">🛡</button>
            <button data-action="special">✦</button>
        </div>

    </div>

    <div id="message"></div>

</div>

<script src="game.js"></script>

</body>
</html>
